name: Python Tests

on:
  push:
    branches: [main, py-package]
  pull_request:
    branches: [main]

permissions: read-all

jobs:
  python-tests:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest python-docx pillow pyyaml

      - name: Run pytest
        run: |
          python -m pytest inst/python/tests
