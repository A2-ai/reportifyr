# report directory options
report_dir_name: "report"

# outputs directory options
outputs_dir_name: "OUTPUTS"

# strict mode - duplicate artifacts
strict: false

# Footnotes options
footnotes_font: "Arial Narrow"
footnotes_font_size: 10
use_object_path_as_source: FALSE
add_hash_to_footnotes: FALSE
wrap_path_in_[]: TRUE
combine_duplicate_footnotes: TRUE
abbreviation_delimiter: ","
footnote_order:
  - Source
  - Object
  - Notes
  - Abbreviations
  - Hash

# Table options
save_table_rtf: FALSE
# Table insertion engine: "officer" (flextable::body_add_flextable) or "tblkit" (experimental)
table_engine: "officer"
# tblkit only: limit on the document's word/document.xml, in bytes (tblkit's own default
# is 64 MiB; large reports need more, and memory use grows with it)
tblkit_max_story_bytes: 536870912

# Caption options
keep_caption_next: TRUE
add_alt_text: TRUE
skip_unchanged: TRUE

# Figure options
fig_alignment: "center"
use_artifact_size: TRUE
default_fig_width: 6
use_embedded_dimensions: TRUE
label_multi_figures: FALSE
# Stamp a path onto saved PNGs: "none", "source" (script path), or "object" (image path)
add_path_overlay: "none"
